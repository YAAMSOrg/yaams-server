x-app: &app
  image: ghcr.io/yaamsorg/yaams-server:latest
  env_file: .env
  volumes:
    - ./storage-data:/app/storage:z
  networks:
    - yaams
  restart: unless-stopped

services:
  db:
    image: docker.io/mariadb:lts
    container_name: yaams-db
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-yaams}
      MARIADB_USER: ${DB_USERNAME:-yaams}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - ./db-data:/var/lib/mysql:z
    networks:
      - yaams
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    container_name: yaams-migrate
    command: php artisan migrate --force
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    container_name: yaams-app
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    container_name: yaams-worker
    command: php artisan queue:work --tries=3
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    container_name: yaams-scheduler
    command: php artisan schedule:work
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  yaams:
    name: yaams
